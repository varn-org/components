name: Tests

on:
  workflow_dispatch:
    inputs:
      varn-version:
        description: "varn release to test against"
        default: "v1.0.0"
  workflow_call:
    inputs:
      varn-version:
        description: "varn release to test against"
        type: string
        default: "v1.0.0"
  push:
    branches: [main]
    paths-ignore:
      - "**/*.md"
      - "docs/**"
  pull_request:
    branches: [main]
    paths-ignore:
      - "**/*.md"
      - "docs/**"
  schedule:
    # a weekly run catches a varn release that broke a component without anything here changing
    - cron: "0 6 * * 1"

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

env:
  VARN_VERSION: ${{ inputs.varn-version || 'v1.0.0' }}

jobs:
  local:
    name: Components (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-latest, windows-latest]

    steps:
      - uses: actions/checkout@v4

      - name: Cache the varn release
        uses: actions/cache@v4
        with:
          path: .varn
          key: varn-${{ runner.os }}-${{ runner.arch }}-${{ env.VARN_VERSION }}

      # everything except the tests that need a database, so this stays fast on every platform
      - name: Run the component tests
        run: python3 run.py --varn-version "$VARN_VERSION"
        shell: bash

  backends:
    name: Components with redis, mysql and postgres
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v4

      - name: Cache the varn release
        uses: actions/cache@v4
        with:
          path: .varn
          key: varn-${{ runner.os }}-${{ runner.arch }}-${{ env.VARN_VERSION }}

      # the vdo mysql and pgsql drivers dlopen their client library, so those come from the runner
      - name: Install the database client libraries
        run: sudo apt-get update && sudo apt-get install -y libmysqlclient21 libpq5 libsqlite3-0

      - name: Run every component test
        run: python3 run.py --varn-version "$VARN_VERSION" --backends
